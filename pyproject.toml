# Tool configuration only; this repo is not an installable Python package.

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["cmk_addons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
extraPaths = [
    "/omd/sites/cmk/lib/python3",
    "/omd/sites/cmk/local/lib/python3",
]
